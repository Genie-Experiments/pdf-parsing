# ─────────────────────────────────────────────────────────────────────────────
# Production overlay — adds HTTPS / TLS 1.3 via Traefik + Let's Encrypt ACME
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env vars (in addition to base docker-compose.yml):
#   DOMAIN         — public domain, e.g. pdf.example.com
#   ACME_EMAIL     — email for Let's Encrypt expiry notifications
#   COOKIE_SECURE  — must be "true"
#   COOKIE_SAMESITE— "lax" (same domain) or "none" (cross-subdomain, needs COOKIE_SECURE=true)
# ─────────────────────────────────────────────────────────────────────────────

services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # HTTP entrypoint — permanent redirect to HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # HTTPS entrypoint — TLS 1.3 minimum enforced via dynamic.yml
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt ACME (TLS challenge — no inbound port 80 proxy needed)
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required for production}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/letsencrypt

  api:
    # Remove direct port exposure in production — traffic flows through Traefik only
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN:?DOMAIN is required}`) && (PathPrefix(`/api/`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=secure-headers@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  frontend:
    # Remove direct port exposure in production — traffic flows through Traefik only
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=secure-headers@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  traefik_certs:
