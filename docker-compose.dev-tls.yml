# ─────────────────────────────────────────────────────────────────────────────
# Dev TLS overlay — HTTPS on localhost using mkcert
#
# Prerequisites:
#   1. brew install mkcert       (macOS) | choco install mkcert (Windows)
#   2. make certs                        — generates traefik/certs/localhost.*
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev-tls.yml up -d
#   — or —
#   make dev-tls
#
# After starting:
#   Frontend: https://localhost
#   API:      https://localhost/api/v1
#
# With Traefik routing both services on the same origin (https://localhost),
# cookies have SameSite=Lax + Secure, and CORS is irrelevant (same-origin).
# ─────────────────────────────────────────────────────────────────────────────

services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # HTTP — redirects to HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # HTTPS — TLS 1.3 enforced via dynamic.yml
      - "--entrypoints.websecure.address=:443"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # mkcert-generated certificates (created by `make certs`)
      - ./traefik/certs:/certs:ro

  api:
    # No direct port exposure — all traffic through Traefik
    ports: !reset []
    environment:
      # HTTPS URLs for the OAuth redirect and cookie settings
      OAUTH_REDIRECT_BASE_URL: "https://localhost"
      FRONTEND_URL: "https://localhost"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`localhost`) && (PathPrefix(`/api/`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.middlewares=secure-headers@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  frontend:
    ports: !reset []
    build:
      args:
        # Same origin as the API — no CORS, cookies work seamlessly
        NEXT_PUBLIC_API_URL: "https://localhost/api/v1"
        NEXT_PUBLIC_DEV_BYPASS_AUTH: "${DEV_BYPASS_AUTH:-false}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.middlewares=secure-headers@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
