version: '3.8'

services:
  pdf-parsing:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-parsing:latest
    container_name: pdf-parsing-app
    
    # Mount volumes for data persistence
    volumes:
      # Input data directory
      - ./Data:/app/Data:ro
      
      # Output directories
      - ./temp_results:/app/Results
      - ./processed_images_by_dolphin:/app/processed_images_by_dolphin
      - ./temp_raw_text:/app/pdfs_raw_text
      - ./section_hierarchy_pdfs:/app/section_hierarchy_pdfs
      - ./temp_data:/app/Data
      
      # Configuration file
      - ./config/config.py:/app/config/config.py:ro
      
      # Environment file (if using OpenAI API)
      - ./.env:/app/.env:ro
    
    # For GPU support (uncomment if you have NVIDIA GPU and nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
