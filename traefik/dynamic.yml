# ─────────────────────────────────────────────────────────────────────────────
# Traefik dynamic configuration (shared by dev-tls and production)
#
# TLS options enforce TLS 1.3 minimum when HTTPS is active.
# The static certificate block is used by the dev-tls overlay (mkcert).
# In production the ACME certresolver on each router takes precedence.
#
# See: https://doc.traefik.io/traefik/https/tls/
# ─────────────────────────────────────────────────────────────────────────────

tls:
  options:
    default:
      # Reject TLS 1.0, 1.1, and 1.2 — TLS 1.3 only
      minVersion: VersionTLS13
      # TLS 1.3 cipher suites are mandated by RFC 8446; Go enforces them
      # unconditionally. Listed here for documentation/audit purposes.
      cipherSuites:
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - X25519
        - CurveP256
        - CurveP384
      sniStrict: true

  # Static certificate for local dev (generated by `make certs` / mkcert).
  # Production routers use certresolver=letsencrypt and ignore this block.
  certificates:
    - certFile: /certs/localhost.pem
      keyFile: /certs/localhost-key.pem

http:
  middlewares:
    # Security response headers — applied via "secure-headers@file" in router labels
    secure-headers:
      headers:
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        # HSTS: 1 year, include subdomains, eligible for browser preload list
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        referrerPolicy: "strict-origin-when-cross-origin"
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          connect-src 'self';
          font-src 'self';
          object-src 'none';
          frame-ancestors 'none'
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        customResponseHeaders:
          X-Powered-By: ""
